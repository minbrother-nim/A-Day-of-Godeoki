<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고덕이의 하루, 광고를 읽다!</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2440; --paper:#FAFBFF; --sun:#FFC83D; --sun-dk:#E9A800;
  --tomato:#F0533F; --mint:#14A687; --violet:#6A5CFF;
  --how:#14A687; --view:#6A5CFF; --why:#F0533F;
  --disp:'Black Han Sans','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button,p,span,div,h1,h2,h3,li,b,em,small,strong{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
html,body{width:100%;height:100%;overflow:hidden;background:#151A33;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:var(--paper);border-radius:6px}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,transform .6s ease,visibility 0s .6s}
.scene.active{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease,transform .6s ease,visibility 0s}
.scene.from-right{transform:translateX(70px)}
.scene.from-left{transform:translateX(-70px)}
.scene.out-left{transform:translateX(-70px)}
.scene.out-right{transform:translateX(70px)}
.abs{position:absolute}
.full{position:absolute;inset:0;width:100%;height:100%}

/* step-driven visibility */
[data-on]{opacity:0;visibility:hidden;transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
[data-on].vis{opacity:1;visibility:visible;transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
.rise:not(.vis){transform:translateY(26px)}
.pop:not(.vis){transform:scale(.86)}
.dropin:not(.vis){transform:translateY(-30px)}
.instant{transition:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:50;pointer-events:none}
#hud>*{pointer-events:auto}
.loc{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:40px;padding:6px 20px 6px 8px;box-shadow:4px 4px 0 var(--ink);transition:opacity .4s}
.loc .badge{background:var(--ink);color:var(--sun);font-family:var(--disp);font-size:22px;padding:5px 14px;border-radius:30px;letter-spacing:.5px}
.loc .place{font-weight:800;font-size:24px}
.loc .tag{font-size:20px;color:#5B6283;font-weight:600}
.hud-right{display:flex;gap:12px;align-items:center}
.found{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:40px;padding:6px 16px;box-shadow:4px 4px 0 var(--ink);font-weight:800;font-size:20px}
.slots{display:flex;gap:6px}
.slot{width:24px;height:24px;border-radius:7px;border:2.5px solid var(--ink);background:#E8EBF5;transition:background .4s,transform .4s}
.slot.on{background:var(--sun);transform:rotate(-8deg) scale(1.08)}
.icon-btn{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:22px;font-weight:900;display:grid;place-items:center}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hidden{opacity:0!important;pointer-events:none!important}
.gone{display:none!important}

/* ---------- bottom nav ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 14px;z-index:50;pointer-events:none}
#nav>*{pointer-events:auto;transition:opacity .3s}
#backBtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink);font-size:26px;font-weight:900;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
#nextBtn{background:var(--sun);border:3.5px solid var(--ink);border-radius:40px;padding:12px 30px 12px 32px;font-size:26px;font-weight:900;color:var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;gap:12px}
#nextBtn .arr{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
#nextBtn:hover{background:#FFD566}
#nextBtn:active,#backBtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
@keyframes nudge{50%{transform:translateX(6px)}}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

/* ---------- speech bubbles ---------- */
.bubble{position:absolute;background:#FFF5D1;color:#141830;border:4px solid var(--ink);border-radius:30px;padding:18px 30px;font-size:36px;font-weight:800;line-height:1.35;box-shadow:6px 6px 0 #FFC83D,0 0 0 3px rgba(255,200,61,.35);white-space:nowrap;z-index:5}
.bubble .tail{position:absolute;width:44px;height:40px;bottom:-37px;left:60px}
.bubble.tail-r .tail{left:auto;right:60px;transform:scaleX(-1)}
.bubble.think{border-radius:44px}
.bubble.think .tail{display:none}
.bubble.think::before,.bubble.think::after{content:"";position:absolute;background:#FFF5D1;border:4px solid var(--ink);border-radius:50%}
.bubble.think::before{width:26px;height:26px;bottom:-34px;left:56px}
.bubble.think::after{width:15px;height:15px;bottom:-56px;left:40px}
.bubble.think.tail-r::before{left:auto;right:56px}.bubble.think.tail-r::after{left:auto;right:40px}
.caption{position:absolute;background:var(--sun);border:3px solid var(--ink);padding:8px 18px;font-weight:800;font-size:22px;box-shadow:4px 4px 0 var(--ink)}

/* ---------- character ---------- */
.gd svg{width:100%;height:auto;display:block;overflow:visible}
.walking .leg-l{animation:legA .64s ease-in-out infinite alternate}
.walking .leg-r{animation:legB .64s ease-in-out infinite alternate}
.walking .arm-l{animation:armA .64s ease-in-out infinite alternate}
.walking .arm-r{animation:armB .64s ease-in-out infinite alternate}
.walking .gd-body{animation:bob .32s ease-in-out infinite alternate}
.leg-l{transform-origin:-32px 282px}.leg-r{transform-origin:32px 282px}
@keyframes legA{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes legB{from{transform:rotate(17deg)}to{transform:rotate(-17deg)}}
@keyframes armA{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes armB{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}

/* ---------- ad focus overlay ---------- */
.focus{position:absolute;inset:0;z-index:20}
.focus .dim{position:absolute;inset:0;background:rgba(21,26,51,.78);backdrop-filter:blur(3px)}
.focus-row{position:absolute;left:40px;right:40px;top:84px;bottom:96px;display:flex;align-items:center;justify-content:center;gap:0;transition:gap .6s}
.focus-row.split{gap:36px}
.ad-box{flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:all .6s cubic-bezier(.2,.8,.2,1);position:relative}
.focus.vis .ad-box{animation:zoomIn .7s cubic-bezier(.2,.9,.25,1.1)}
@keyframes zoomIn{from{transform:scale(.45);opacity:0}to{transform:none;opacity:1}}
.ad-img{display:block;width:auto;height:auto;max-height:690px;max-width:1380px;border:6px solid #fff;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.45);transition:max-height .6s cubic-bezier(.2,.8,.2,1),max-width .6s cubic-bezier(.2,.8,.2,1)}
.split .ad-img{max-height:660px;max-width:640px}
.talk{align-items:flex-start}.talk .ad-img{max-height:560px}
.split .ad-img.wide{max-width:690px}
.ad-tag{position:absolute;top:-18px;left:-18px;background:var(--tomato);color:#fff;font-family:var(--disp);font-size:24px;padding:4px 16px;border:3px solid var(--ink);border-radius:10px;transform:rotate(-6deg);z-index:2}
.panel{flex:1 1 auto;max-width:0;opacity:0;overflow:hidden;background:#F2F5FD;border:4px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:0;max-height:100%;transition:max-width .6s cubic-bezier(.2,.8,.2,1),opacity .5s .1s,padding .6s;display:flex;flex-direction:column}
.split .panel{max-width:960px;opacity:1;padding:16px 22px 18px}
.panel-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;min-width:560px}
.avatar{width:54px;height:54px;border-radius:50%;background:#CFEFE7;border:3px solid var(--ink);overflow:hidden;flex:0 0 auto}
.avatar svg{width:100%;height:100%}
.panel-head h3{font-family:var(--disp);font-weight:400;font-size:36px;letter-spacing:.5px}
.intro-thought{background:#fff;border:3px dashed #9AA3C6;border-radius:22px;padding:10px 20px;font-size:29px;font-weight:700;line-height:1.38;margin-bottom:10px;min-width:560px}
.tracker{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-width:560px}
.tracker .chip{flex:1;border:3px solid #C7CDE3;border-radius:14px;padding:6px 10px;background:#fff;color:#A1A8C3;transition:all .4s;text-align:center}
.tracker .chip small{display:block;font-size:15px;font-weight:700}
.tracker .chip b{display:block;font-size:20px;font-weight:900;white-space:nowrap}
.tracker .chip.lit.how{border-color:var(--how);color:var(--how);background:#E2F6F1}
.tracker .chip.lit.view{border-color:var(--view);color:var(--view);background:#ECEAFF}
.tracker .chip.lit.why{border-color:var(--why);color:var(--why);background:#FDE8E5}
.tracker .arrow{font-weight:900;color:#9AA3C6;font-size:22px}
.qs{list-style:none;display:flex;flex-direction:column;gap:6px;min-width:560px;flex:1 1 auto}
.q{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;font-size:25px;line-height:1.36;color:#4E5578;font-weight:600;padding:6px 12px;border-radius:16px;border:3px solid transparent;transition:font-size .4s,background .4s,border-color .4s,box-shadow .4s,color .4s}
.q .n{width:38px;height:38px;border-radius:50%;background:#DDE2F1;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--ink);margin-top:-1px}
.q.cur{font-size:33px;font-weight:800;color:var(--ink);background:#fff;border-color:var(--ink);box-shadow:5px 5px 0 var(--qc,var(--ink))}
.q.cur .n{background:var(--qc);color:#fff}
.q.how{--qc:var(--how)}.q.view{--qc:var(--view)}.q.why{--qc:var(--why)}
.qt{display:inline-block;font-size:.62em;font-weight:900;color:#fff;background:var(--qc);border-radius:20px;padding:2px 12px;margin-right:8px;vertical-align:.18em;white-space:nowrap}
.hl{font-style:normal;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--qc) 30%,transparent) 58%);padding:0 2px}
.q.cur .hl{background:linear-gradient(transparent 52%,color-mix(in srgb,var(--qc) 34%,transparent) 52%);color:var(--qc)}
.say-float{position:absolute;left:60px;bottom:110px;display:flex;align-items:flex-end;gap:12px;z-index:3}
.say-float .face{width:120px;height:120px;border-radius:50%;background:#CFEFE7;border:4px solid var(--ink);overflow:hidden}
.say-float .face svg{width:100%;height:100%}
.say-float .bubble{position:relative;font-size:38px}
.say-float .bubble .tail{left:-30px;bottom:18px;transform:rotate(90deg)}

/* ---------- video frames ---------- */
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.vwrap video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.playbig{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);border:0;transition:opacity .3s}
.playbig span{width:130px;height:130px;border-radius:50%;background:var(--sun);border:5px solid var(--ink);display:grid;place-items:center;box-shadow:6px 6px 0 var(--ink);font-size:56px;padding-left:10px;color:var(--ink)}
.playbig em{position:absolute;bottom:22%;font-style:normal;color:#fff;font-weight:800;font-size:24px;text-shadow:0 2px 8px #000}
.playing .playbig{opacity:0;pointer-events:none}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity .3s}
.vwrap:hover .vbar,.vwrap:not(.playing) .vbar{opacity:1}
.vbar button{width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:900}
.vbar .track{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.3);cursor:pointer;position:relative}
.vbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sun);border-radius:6px}
.vbar .time{color:#fff;font-weight:700;font-size:18px;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.phone-land{width:1130px;background:#23283F;border:5px solid var(--ink);border-radius:56px;padding:26px 30px 26px 54px;position:relative;box-shadow:0 22px 60px rgba(0,0,0,.5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.phone-land::before{content:"";position:absolute;left:20px;top:50%;width:12px;height:64px;margin-top:-32px;border-radius:8px;background:#11152A}
.phone-land .vwrap{border-radius:18px}
.split .phone-land{width:640px;border-radius:44px;padding:20px 22px 20px 42px}
.billboard{width:1160px;position:relative;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.billboard .bb-frame{background:#2C3149;border:5px solid var(--ink);border-radius:14px;padding:22px;position:relative;box-shadow:0 22px 60px rgba(0,0,0,.5)}
.billboard .bb-frame::after{content:"";position:absolute;inset:8px;border-radius:8px;border:3px dotted rgba(255,200,61,.55);pointer-events:none}
.billboard .bb-legs{display:flex;justify-content:space-around;height:40px}
.billboard .bb-legs i{width:26px;background:#6B7290;border:4px solid var(--ink);border-top:0}
.billboard .bb-plate{position:absolute;top:-16px;right:40px;background:var(--sun);border:3px solid var(--ink);font-weight:900;font-size:16px;padding:2px 12px;border-radius:8px}
.split .billboard{width:650px}

/* ---------- mission ---------- */
.mission{position:absolute;inset:0;z-index:30;display:grid;place-items:center}
.mission .back{position:absolute;inset:0;background:rgba(14,18,38,.82)}
.mission .rays{position:absolute;left:50%;top:50%;width:1800px;height:1800px;margin:-900px 0 0 -900px;background:repeating-conic-gradient(rgba(255,200,61,.10) 0 9deg,transparent 9deg 18deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mcard{position:relative;width:1240px;background:#232A4D;border:5px solid var(--sun);border-radius:30px;box-shadow:0 0 0 6px var(--ink),0 30px 80px rgba(0,0,0,.6);color:#fff;padding:26px 44px 30px;transform:scale(.7);transition:transform .55s cubic-bezier(.2,1.2,.3,1)}
.mission.vis .mcard{transform:none}
.mcard .rule{height:4px;background:repeating-linear-gradient(90deg,var(--sun) 0 18px,transparent 18px 26px);margin:6px 0 14px}
.mtitle{text-align:center;font-family:var(--disp);font-size:66px;color:var(--sun);letter-spacing:2px;text-shadow:4px 4px 0 var(--ink)}
.mtitle .star{display:inline-block;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(1.25) rotate(20deg)}}
.mission.vis .mfound{animation:mFade .45s .55s both}
.mission.vis .mgroup{animation:mStamp .45s 1.05s both}
.mission.vis .mtext,.mission.vis .checks{animation:mFade .45s 1.3s both}
@keyframes mFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mStamp{0%{opacity:0;transform:rotate(-3deg) scale(1.8)}70%{opacity:1;transform:rotate(-3deg) scale(.94)}100%{opacity:1;transform:rotate(-3deg) scale(1)}}
.finale{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(14,18,38,.95);pointer-events:none;opacity:0;visibility:hidden}
.board.vis .finale{animation:finale 2.9s ease both}
.finale div{font-family:var(--disp);font-size:88px;color:var(--sun);text-shadow:6px 6px 0 #000;text-align:center;line-height:1.25}
.finale div small{display:block;font-family:var(--body);font-size:34px;font-weight:800;color:var(--sun);-webkit-text-stroke:0;text-shadow:none;margin-bottom:12px}
@keyframes finale{0%{opacity:0;visibility:visible;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}78%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.mfound{text-align:center;font-size:36px;font-weight:800}
.mfound b{color:var(--sun)}
.mbody{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;margin-top:10px}
.mthumb{position:relative;display:flex;align-items:center;justify-content:center;width:430px;height:360px;background:#141A36;border-radius:18px;border:3px solid #48507A}
.mthumb img{max-width:400px;max-height:330px;width:auto;height:auto;display:block;border-radius:6px}
.mthumb .vbadge{position:absolute;left:14px;top:14px;background:var(--tomato);color:#fff;font-weight:900;font-size:18px;padding:3px 12px;border-radius:8px;border:2px solid #fff}
.mthumb .pl{position:absolute;width:76px;height:76px;border-radius:50%;background:rgba(255,200,61,.95);border:4px solid var(--ink);display:grid;place-items:center;font-size:32px;color:var(--ink);padding-left:6px}
.mgroup{display:inline-block;font-family:var(--disp);font-size:60px;color:var(--ink);background:var(--sun);padding:4px 26px;border-radius:18px;border:4px solid var(--ink);transform:rotate(-3deg);box-shadow:5px 5px 0 #000}
.mtext{font-size:42px;font-weight:800;line-height:1.38;margin-top:18px}
.mtext em{font-style:normal;color:var(--sun)}
.checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.checks span{background:#fff;color:var(--ink);font-weight:800;font-size:27px;padding:6px 18px;border-radius:30px;border:3px solid var(--ink)}
.checks span::before{content:"✔ ";color:var(--mint)}
.flow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;font-weight:900;font-size:24px}
.flow span{padding:7px 18px;border-radius:30px;border:3px solid currentColor;background:rgba(255,255,255,.06)}
.flow .f1{color:#4FE0BE}.flow .f2{color:#A9A1FF}.flow .f3{color:#FF8A7A}
.flow i{font-style:normal;color:#8D95BE}

.go-layer{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(21,26,51,.35)}
.go-btn{font-family:var(--disp);font-size:56px;background:var(--sun);border:5px solid var(--ink);border-radius:30px;padding:28px 56px;box-shadow:9px 9px 0 var(--ink);color:var(--ink);animation:pulse 1.6s ease-in-out infinite}
.go-btn:active{transform:translate(5px,5px);box-shadow:4px 4px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.04)}}

/* ---------- detect popup ---------- */
.detect{position:absolute;z-index:12;background:var(--ink);color:#fff;border:4px solid var(--sun);border-radius:20px;padding:18px 30px;font-size:40px;font-weight:900;box-shadow:0 0 0 6px rgba(255,200,61,.3),8px 8px 0 rgba(0,0,0,.3);white-space:nowrap}
.detect small{display:block;font-size:20px;font-weight:700;color:var(--sun);letter-spacing:1px;margin-bottom:2px}
.ring{position:absolute;pointer-events:none;border-radius:50%;border:6px solid var(--sun);box-shadow:0 0 30px rgba(255,200,61,.9),inset 0 0 30px rgba(255,200,61,.6);animation:ringpulse 1.1s ease-in-out infinite}
@keyframes ringpulse{50%{transform:scale(1.08);opacity:.7}}
.scanline{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(255,200,61,.75),inset 0 0 120px rgba(255,200,61,.35)}

.hint{position:absolute;pointer-events:none;background:var(--tomato);color:#fff;font-weight:900;font-size:24px;padding:8px 18px;border-radius:30px;border:3px solid var(--ink);white-space:nowrap;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-8px)}}
.clickable{cursor:pointer}

/* ---------- title ---------- */
#title{background:linear-gradient(180deg,#C9C2FF 0%,#FFD7C2 62%,#FFE9C9 100%)}
.t-wrap{position:absolute;left:100px;top:150px;width:920px}
.goal{margin-top:22px;display:inline-block;background:rgba(255,255,255,.86);border:4px solid var(--ink);border-radius:24px;padding:16px 30px 16px;box-shadow:6px 6px 0 var(--ink);backdrop-filter:blur(4px)}
.goal-h{font-size:26px;font-weight:900;color:var(--tomato)}
.goal p{font-size:38px;font-weight:800;line-height:1.36;margin-top:4px;color:var(--ink)}
.goal-code{display:block;margin-top:8px;font-size:21px;font-weight:700;color:#4A5072}
.t-kicker{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:22px;padding:8px 18px;border-radius:30px}
.t-main{font-family:var(--disp);font-weight:400;font-size:104px;line-height:1.08;margin-top:18px;color:var(--ink);letter-spacing:-1px}
.t-main .l2{position:relative;display:inline-block}
.t-main .l2::before{content:"";position:absolute;left:-10px;right:-14px;bottom:8px;height:44px;background:var(--sun);z-index:-1;transform:rotate(-1.5deg);border-radius:6px}

/* ===== 발표 화면 v8: 광고 이미지 + 분석 질문 ===== */
.pr-stage{position:absolute;inset:0}
.pr-now{position:absolute;left:80px;right:80px;top:162px;height:84px;display:flex;align-items:center;gap:24px;background:#fff;border:4px solid var(--ink);border-left:18px solid var(--c);border-radius:20px;padding:0 26px;box-shadow:6px 6px 0 var(--ink)}
.pr-now b{font-family:var(--disp);font-weight:400;font-size:58px;color:var(--c);line-height:1}
.pr-now span{flex:1;font-size:32px;font-weight:900;line-height:1.2}
.pr-now em{font-style:normal;font-size:22px;color:#5E6587;margin-right:12px}
.pr-live{font-style:normal;font-size:22px;font-weight:900;background:var(--tomato);color:#fff;padding:6px 16px;border-radius:20px}
.pr-imgbox{position:absolute;left:80px;top:268px;width:690px;height:530px;display:flex;align-items:center;justify-content:center;background:#E8ECF7;border:4px solid var(--ink);border-radius:22px}
.pr-img{display:block;max-width:660px;max-height:500px;width:auto;height:auto;border:5px solid #fff;border-radius:6px;box-shadow:0 12px 30px rgba(31,36,64,.3);cursor:zoom-in;transition:transform .25s,box-shadow .25s}
.pr-img:hover{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 0 30px 8px rgba(255,200,61,.9)}
.pr-zoom{position:absolute;right:14px;bottom:12px;background:rgba(31,36,64,.85);color:#fff;font-size:17px;font-weight:800;padding:4px 12px;border-radius:14px;pointer-events:none}
.pr-qs{position:absolute;left:800px;right:80px;top:258px}
.pr-qh{font-size:30px;font-weight:900;margin-bottom:6px}
.pr-q{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:8px 22px 10px}
.pqh{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;color:#3A4166}
.pqh b{font-family:var(--disp);font-weight:400;font-size:30px;color:var(--tomato)}
.pt{margin-left:auto;font-size:17px;font-weight:900;color:#fff;padding:3px 12px;border-radius:14px}
.pt.how{background:var(--how)}.pt.view{background:var(--view)}.pt.why{background:var(--why)}
.pr-q p{font-size:29px;font-weight:800;line-height:1.32;margin-top:2px;color:var(--ink)}
.pr-ar{text-align:center;font-size:20px;font-weight:900;color:#9AA1B5;line-height:1}
.pr-note{margin-top:8px;font-size:20px;font-weight:700;color:#3A4166;line-height:1.4}
.pr-note small{display:block;font-size:17px;color:#6A7193}
/* 순차 등장 (모둠 카드 → 광고 → 01 → 02 → 03 → 안내) */
.pr-stage .pr-now,.pr-stage .pr-imgbox,.pr-stage .pr-qh,.pr-stage .pr-q,.pr-stage .pr-ar,.pr-stage .pr-note{opacity:0}
.pr-stage.vis .pr-now{animation:prIn .45s ease-out 0s both}
.pr-stage.vis .pr-imgbox{animation:prIn .5s ease-out .25s both}
.pr-stage.vis .pr-qh{animation:prIn .4s ease-out .4s both}
.pr-stage.vis .q1{animation:prIn .4s ease-out .55s both}
.pr-stage.vis .a1{animation:prIn .3s ease-out .7s both}
.pr-stage.vis .q2{animation:prIn .4s ease-out .8s both}
.pr-stage.vis .a2{animation:prIn .3s ease-out .95s both}
.pr-stage.vis .q3{animation:prIn .4s ease-out 1.05s both}
.pr-stage.vis .pr-note{animation:prIn .4s ease-out 1.3s both}
@keyframes prIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#sc-present .pr-btns{top:812px!important;bottom:auto!important;height:62px;z-index:55;pointer-events:none;align-items:center}
#sc-present .pr-btns .lt-btn{pointer-events:auto;font-size:30px;padding:8px 34px}

/* ===== ENDING: 다음 시간 예고 + END ===== */
.nextc{background:linear-gradient(180deg,#FFF8E6 0%,#FDEBD2 100%)}
.nc-main{position:absolute;inset:0;transition:opacity .8s,filter .8s}
.nc-main.gone2{opacity:0;filter:blur(4px)}
.nc-head{position:absolute;left:80px;top:92px;display:flex;align-items:center;gap:18px}
.nc-chip{background:var(--tomato);color:#fff;font-weight:900;font-size:24px;padding:8px 18px;border-radius:12px;letter-spacing:2px}
.nc-title{font-family:var(--disp);font-size:56px}
.nc-card{position:absolute;left:120px;right:120px;display:flex;align-items:center;gap:22px;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:14px 30px}
.nc-card.a{top:180px}.nc-card.b{top:322px;background:var(--ink);color:#fff;box-shadow:6px 6px 0 var(--sun)}
.nci{font-size:52px;flex:0 0 auto}
.nc-card.a b{font-size:34px;font-weight:900}.nc-card.a p{font-size:28px;font-weight:700;margin-top:2px}
.nc-card.b b{font-size:42px;font-weight:900}
.hlw{color:var(--sun)}
.nc-search{position:absolute;left:120px;right:120px;top:438px;text-align:center}
.ns-bar{display:flex;align-items:center;gap:16px;background:#fff;border:4px solid var(--ink);border-radius:50px;padding:10px 12px 10px 30px;font-size:32px;font-weight:800;box-shadow:0 10px 26px rgba(31,36,64,.15)}
.ns-q{color:#3A4166;flex:0 0 auto}
.ns-caret{width:3px;height:36px;background:var(--ink);animation:caret 1s steps(2) infinite;flex:0 0 auto}
@keyframes caret{50%{opacity:0}}
.ns-btn{margin-left:auto;background:var(--tomato);color:#fff;border-radius:40px;padding:8px 30px;font-size:26px}
.nc-search p{font-size:27px;font-weight:700;margin-top:12px}
.nc-flow{position:absolute;left:60px;right:60px;top:588px}
.nf-lead{font-size:28px;font-weight:900;margin-bottom:10px;text-align:center}
.nf-row{display:flex;align-items:stretch;justify-content:center;gap:8px}
.nf{width:236px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 8px;text-align:center;font-size:22px;font-weight:800;line-height:1.3;opacity:0;transform:translateY(16px)}
.nf i{display:block;font-style:normal;font-size:36px;line-height:1.2}
.nf b{display:block;font-size:20px;color:#6A7193}
.nfa{align-self:center;font-size:30px;font-weight:900;color:#9AA1B5;opacity:0}
.nc-flow.vis .nf,.nc-flow.vis .nfa{animation:nfIn .45s ease-out both}
.nc-flow.vis .s1{animation-delay:.1s}.nc-flow.vis .nfa:nth-of-type(1){animation-delay:.4s}
.nc-flow.vis .s2{animation-delay:.6s}.nc-flow.vis .s3{animation-delay:1.2s}.nc-flow.vis .s4{animation-delay:1.8s}.nc-flow.vis .s5{animation-delay:2.4s}
.nc-flow.vis .nfa{animation-delay:.9s}
@keyframes nfIn{to{opacity:1;transform:none}}
.nf.s5{width:290px;background:var(--sun);border-width:5px;font-size:24px;box-shadow:5px 5px 0 var(--ink)}
.nf.s5 u{text-decoration:none;font-size:28px;color:var(--tomato)}
.nc-flow.vis .nf.s5{animation:nfIn .45s ease-out 2.4s both,s5pulse 1.6s ease-in-out 3s infinite}
@keyframes s5pulse{50%{transform:scale(1.06)}}
.nm-card{position:absolute;left:50%;top:50%;width:1040px;margin-left:-520px;margin-top:-330px;background:#fff;border:6px solid var(--ink);border-radius:32px;box-shadow:10px 10px 0 var(--sun);padding:26px 56px 30px;transition:opacity 1.2s ease,transform 1.2s ease!important}
.nm-card:not(.vis){transform:scale(.94)}
.nm-h{font-family:var(--disp);font-size:44px;color:var(--tomato);letter-spacing:2px}
.nm-t{font-size:40px;font-weight:900;margin-bottom:12px}
.nm-card ol{list-style:none;display:flex;flex-direction:column;gap:10px}
.nm-card li{display:flex;align-items:center;gap:18px;font-size:31px;font-weight:800;border-bottom:2px dashed #D3D8E8;padding-bottom:8px}
.nm-card li b{font-family:var(--disp);font-weight:400;font-size:40px;color:var(--tomato);width:56px}
.nm-f{margin-top:14px;font-size:27px;font-weight:700;color:#4E5578;text-align:center}
.the-end{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#2C3466 0%,#141A3A 75%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.4s ease .6s!important}
.the-end .te1{font-size:46px;font-weight:700;line-height:1.45;color:#C9D2F5}
.the-end .te2{font-size:58px;font-weight:800;line-height:1.45;margin-top:18px}
.the-end b{color:var(--sun)}
.te-s{margin-top:26px;font-size:24px;color:#9EA8D6;letter-spacing:2px}
.te-home{margin-top:34px;font-size:30px;padding:10px 36px}

/* ===== 사운드 토글 ===== */

.snd-btn{height:48px;border-radius:30px;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:18px;font-weight:900;color:var(--ink);padding:0 14px 0 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.snd-btn .st{font-size:14px;background:var(--mint);color:#fff;border-radius:10px;padding:1px 7px}
.snd-btn.off{background:#E3E6EF;color:#7B819E}
.snd-btn.off .st{background:#9AA0B8}
.snd-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>

  <div id="hud">
    <div class="loc" id="loc"><span class="badge" id="locBadge">STAGE 1</span><span class="place" id="locPlace">집</span><span class="tag" id="locTag"></span></div>
    <div class="hud-right">
      <div class="found" id="found">발견한 광고 <span class="slots" id="slots"></span> <span id="foundN">0/5</span></div>
      <button class="snd-btn" id="bgmBtn" title="배경음악 켜기/끄기 (B)" aria-pressed="true">🎵 BGM <span class="st">ON</span></button>
      <button class="snd-btn" id="sfxBtn" title="효과음 켜기/끄기 (M)" aria-pressed="true">🔔 효과음 <span class="st">ON</span></button>
      <button class="icon-btn" id="fsBtn" title="전체 화면 (F)" aria-label="전체 화면">⛶</button>
    </div>
  </div>
  <div id="nav">
    <div class="nav-left"><button id="backBtn" aria-label="이전 장면" title="이전 장면 (←)">←</button><button class="menu-btn" id="homeBtn" title="처음으로">⌂ 처음으로</button><button class="menu-btn" id="menuBtn" aria-expanded="false">☰ MENU</button></div>
    <button id="nextBtn">클릭해서 다음 장면으로 <span class="arr">→</span></button>
  </div>
  <div id="menuPanel" role="menu">
    <div class="mh">이동할 곳을 고르세요</div>
    <button data-jump="p1cover"><i>⌂</i>처음으로</button>
    <button data-jump="p1goal"><i>🎯</i>학습 목표</button>
    <button data-jump="p1div"><i>📖</i>복습하기</button>
    <button data-jump="p2div"><i>✏️</i>오늘의 학습</button>
    <button data-jump="p2demo"><i>🎺</i>광고 분석 시범</button>
    <hr>
    <button data-jump="title"><i>🎮</i>고덕이의 하루 (시작 화면)</button>
    <button data-jump="s1card"><i>🏠</i>STAGE 1 집</button>
    <button data-jump="s2card"><i>🚶</i>STAGE 2 고덕도서관 가는 길</button>
    <button data-jump="s3card"><i>📚</i>STAGE 3 고덕도서관</button>
    <hr>
    <button data-jump="final" data-k="8"><i>🏁</i>모둠 활동 (15분)</button>
    <button data-jump="lotto"><i>🎲</i>행운의 랜덤 추첨</button>
    <button data-jump="present"><i>🎤</i>발표</button>
    <button data-jump="nextclass"><i>🔜</i>다음 시간 예고</button>
  </div>
  <div class="lightbox" id="lightbox"><div class="lb-in" id="lbIn"></div><button class="close" id="lbClose" aria-label="닫기">✕</button></div>
</div>

<script>
/* =========================================================
   자원 경로 (index.html과 같은 폴더의 assets 폴더)
========================================================= */
const A = {
  heinz:'assets/ad_heinz.jpg', block:'assets/ad_block.jpg', gyo:'assets/ad_gyoranjong.jpg',
  gramV:'assets/ad_gram.mp4', gramT:'assets/thumb_gram.jpg',
  tokV:'assets/ad_tok.mp4',  tokT:'assets/thumb_tok.jpg'
};
const C = {ink:'#1F2440',skin:'#FFDCC2',hair:'#2B2F45',hood:'#AEB1B8',hoodDk:'#8E9199',jeans:'#1C1D23',blush:'#FF9C8A'};

/* =========================================================
   고덕이 일러스트
========================================================= */
function head(o={}){
  const {mouth='smile',look='front',brows='normal'}=o;
  let ex=0,ey=0;
  if(look==='right'){ex=8} if(look==='left'){ex=-8}
  if(look==='up'){ey=-8} if(look==='down'){ey=7}
  if(look==='upright'){ex=7;ey=-7} if(look==='downright'){ex=7;ey=6}
  const S=`stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"`;
  const mouths={
    smile:`<path d="M-15,52 Q0,66 15,52" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`,
    open:`<path d="M-17,48 Q0,78 17,48 Z" fill="#C64A55" ${S}/>`,
    o:`<ellipse cx="0" cy="58" rx="9" ry="12" fill="#C64A55" ${S}/>`,
    hmm:`<path d="M-12,57 Q0,52 12,57" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`,
    chew:`<path d="M-14,54 Q-7,60 0,54 Q7,60 14,54" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`
  };
  const browsD={
    normal:`M-46,-6 Q-33,-14 -20,-7 M20,-7 Q33,-14 46,-6`,
    up:`M-46,-16 Q-33,-26 -20,-17 M20,-17 Q33,-26 46,-16`,
    puzzle:`M-46,-8 Q-33,-12 -20,-6 M20,-18 Q33,-28 46,-16`
  };
  return `<g>
    <ellipse cx="0" cy="-12" rx="93" ry="86" fill="${C.hair}" ${S}/>
    <circle cx="-80" cy="22" r="15" fill="${C.skin}" ${S}/>
    <circle cx="80" cy="22" r="15" fill="${C.skin}" ${S}/>
    <ellipse cx="0" cy="18" rx="78" ry="78" fill="${C.skin}" ${S}/>
    <path d="M-90,8 C-98,-72 -46,-102 0,-102 C46,-102 98,-72 90,8 L76,-14 L62,8 L44,-22 L24,2 L4,-26 L-16,0 L-36,-24 L-54,6 L-72,-16 Z" fill="${C.hair}" ${S}/>
    <path d="M-2,-98 C0,-134 36,-142 32,-114" fill="none" stroke="${C.ink}" stroke-width="15" stroke-linecap="round"/>
    <path d="M-2,-98 C0,-134 36,-142 32,-114" fill="none" stroke="${C.hair}" stroke-width="7" stroke-linecap="round"/>
    <path d="${browsD[brows]}" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="${-30+ex}" cy="${24+ey}" rx="9.5" ry="12.5" fill="${C.ink}"/>
    <ellipse cx="${30+ex}" cy="${24+ey}" rx="9.5" ry="12.5" fill="${C.ink}"/>
    <circle cx="${-27+ex}" cy="${19+ey}" r="3.4" fill="#fff"/>
    <circle cx="${33+ex}" cy="${19+ey}" r="3.4" fill="#fff"/>
    <ellipse cx="-52" cy="46" rx="13" ry="7.5" fill="${C.blush}" opacity=".65"/>
    <ellipse cx="52" cy="46" rx="13" ry="7.5" fill="${C.blush}" opacity=".65"/>
    ${mouths[mouth]}
  </g>`;
}
function arm(side,deg,item='',cls=''){
  const sx=side==='l'?-86:86;
  const S=`stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"`;
  return `<g class="arm arm-${side} ${cls}" style="transform-origin:${sx}px 112px;transform:rotate(${deg}deg)">
    <path d="M${sx-22},104 Q${sx-27},106 ${sx-25},126 L${sx-21},236 Q${sx},248 ${sx+21},236 L${sx+25},126 Q${sx+27},106 ${sx+22},104 Z" fill="${C.hood}" ${S}/>
    <path d="M${sx-20},226 L${sx+20},226" stroke="${C.hoodDk}" stroke-width="8"/>
    ${item}
    <circle cx="${sx}" cy="252" r="19" fill="${C.skin}" ${S}/>
  </g>`;
}
function goduck(o={}){
  const S=`stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"`;
  const armL = o.armL!==undefined?o.armL:6, armR=o.armR!==undefined?o.armR:-6;
  return `<svg viewBox="-140 -150 280 600" xmlns="http://www.w3.org/2000/svg"><g class="gd-body">
    <g class="leg leg-l"><path d="M-62,276 L-56,408 L-12,408 L-6,280 Z" fill="${C.jeans}" ${S}/><path d="M-55,284 L-50,402" stroke="#fff" stroke-width="6"/><path d="M-62,402 Q-70,430 -42,432 L-4,432 Q2,410 -12,402 Z" fill="#fff" ${S}/></g>
    <g class="leg leg-r"><path d="M6,280 L12,408 L56,408 L62,276 Z" fill="${C.jeans}" ${S}/><path d="M55,284 L50,402" stroke="#fff" stroke-width="6"/><path d="M12,402 Q4,432 30,432 L70,432 Q74,410 56,402 Z" fill="#fff" ${S}/></g>
    <path d="M-72,96 Q-98,104 -100,142 L-104,286 Q0,302 104,286 L100,142 Q98,104 72,96 Z" fill="${C.hood}" ${S}/>
    <path d="M-56,224 Q0,214 56,224 L60,272 L-60,272 Z" fill="${C.hoodDk}" opacity=".45"/>
    <rect x="-18" y="78" width="36" height="28" fill="${C.skin}" ${S}/>
    <path d="M-62,94 Q0,152 62,94" fill="none" stroke="${C.hoodDk}" stroke-width="12" stroke-linecap="round"/>
    <path d="M-16,130 L-19,182 M16,130 L19,182" stroke="#3B3C44" stroke-width="5" stroke-linecap="round"/>
    <image href="assets/gd_logo.png" x="28" y="136" width="34" height="36" preserveAspectRatio="xMidYMid meet"/>
    <g class="headwrap">${o.head||head()}</g>
    ${arm('l',armL,o.itemL||'',o.armLcls||'')}
    ${o.noArmR?'':arm('r',armR,o.itemR||'',o.armRcls||'')}
  </g></svg>`;
}
function avatar(expr){return `<svg viewBox="-110 -125 220 220">${head(expr||{})}</svg>`}
const tail = `<svg class="tail" viewBox="0 0 44 40"><path d="M3,0 H41 V6 H3Z" fill="#FFF5D1"/><path d="M2,2 L22,38 L42,2" fill="#FFF5D1" stroke="#1F2440" stroke-width="4" stroke-linejoin="round"/><path d="M5,0 H39" stroke="#FFF5D1" stroke-width="6"/></svg>`;
function bubble(text,opt={}){
  return `<div class="bubble rise ${opt.cls||''}" data-on="${opt.on}" style="${opt.style||''}">${text}${tail}</div>`;
}

/* =========================================================
   공통 UI 조각
========================================================= */
const TAG = {how:['재현 방식','어떻게 표현했지?'],view:['관점','어떤 관점일까?'],why:['의도','어떤 의도일까?']};
function questions(list,startK){
  // list: [type, html]
  const firsts={};
  list.forEach(([t],i)=>{ if(firsts[t]===undefined) firsts[t]=startK+i; });
  const chip=(t)=>`<div class="chip ${t}" data-cls="lit@${firsts[t]!==undefined?firsts[t]+'-':'999'}"><small>${TAG[t][0]}</small><b>${TAG[t][1]}</b></div>`;
  const tracker=`<div class="tracker">${chip('how')}<span class="arrow">→</span>${chip('view')}<span class="arrow">→</span>${chip('why')}</div>`;
  const items=list.map(([t,h],i)=>{const k=startK+i;return `<li class="q ${t} rise" data-on="${k}-" data-cls="cur@${k}"><span class="n">${i+1}</span><span><span class="qt">${TAG[t][1]}</span>${h}</span></li>`}).join('');
  return {tracker, items};
}
function focus(o){
  // o: on, splitK, ad (html), intro, questions, qStartK, extra, wide
  const q=questions(o.questions,o.qStartK);
  return `<div class="focus" data-on="${o.on}">
    <div class="dim"></div>
    <div class="focus-row" data-cls="split@${o.splitK}-${o.talk?`;talk@${o.talk}`:''}${o.zoom?`;zoomed@${o.zoom}`:''}">
      <div class="ad-box">${o.ad}</div>
      <div class="panel">
        <div class="panel-head"><div class="avatar">${avatar({look:'upright',mouth:'hmm',brows:'puzzle'})}</div><h3>고덕이의 생각 💭</h3></div>
        ${o.intro?`<div class="intro-thought">${o.intro}</div>`:''}
        ${q.tracker}
        <ol class="qs">${q.items}</ol>
      </div>
    </div>
    ${o.extra||''}
    ${o.zoom?`<div class="zoom-ctl" data-on="${o.zoom}"><button class="zc-close" data-zclose>✕ 닫기</button><button class="zc-ok" data-zok>광고를 살펴봤어요 →</button></div>`:''}
  </div>`;
}
function imgAd(src,alt,wide){return `<span class="ad-tag">AD</span><img class="ad-img ${wide?'wide':''}" src="${src}" alt="${alt}">`}
function video(src,poster,id){
  return `<div class="vwrap" data-video="${id}">
    <video id="${id}" src="${src}" poster="${poster}" preload="metadata" playsinline></video>

function solveIK(px,py){
  const [sx,sy]=IK.S, a=IK.L1, b=IK.L2;
  let dx=px-sx, dy=py-sy, d=Math.hypot(dx,dy);
  d=Math.max(Math.abs(a-b)+2,Math.min(a+b-1,d));
  const th=Math.atan2(dy,dx), al=Math.acos((a*a+d*d-b*b)/(2*a*d));
  const c1=th+al, c2=th-al;                          // 두 가지 팔꿈치 위치 중
  const e1=[sx+a*Math.cos(c1),sy+a*Math.sin(c1)], e2=[sx+a*Math.cos(c2),sy+a*Math.sin(c2)];
  const up=(e1[1]>=e2[1])?c1:c2;                     // 아래쪽(자연스러운 쪽) 팔꿈치 선택
  const E=[sx+a*Math.cos(up),sy+a*Math.sin(up)];
  const fore=Math.atan2(py-E[1],px-E[0]);
  return {upper:up*180/Math.PI, fore:fore*180/Math.PI};
}

    L.classList.add('drawing'); drawBusy=true;
    const pool=[1,2,3,4,5].filter(n=>!picks.includes(n));
    const N=idx===0?24:28, roll=idx===0?['drumroll',2.4]:['drumrollLong',3.4];
    const seq=[]; let prev=0;
    for(let i=0;i<N-1;i++){ let n; do{ n=pool[Math.floor(Math.random()*pool.length)]; }while(n===prev||(i===N-2&&n===target)); seq.push(n); prev=n; }
    seq.push(target);
    let t=200; const times=seq.map((_,i)=>{ const iv=55+Math.pow(i/(N-1),2.7)*(idx===0?560:640); t+=iv; return t; });
    const end=times[times.length-1];
    later(()=>playNow('lotImpact'),0);
    later(()=>{ playNow(roll[0]); duckBgm(.3,.3,roll[1]*1000+2200,1.5); }, Math.max(300,end-roll[1]*1000+150));
    seq.forEach((n,i)=>later(()=>{ cards.forEach(c=>c.classList.toggle('hl',+c.dataset.g===n)); if(i<N-1||true) playNow('ltick'); },times[i]));
    later(()=>{                                        // 0.25초 정지 후 공개
      playNow('lotImpact'); setTimeout(()=>playNow('celebrate'),350);
      cards.forEach(c=>c.classList.remove('hl'));
      const c=cards.find(c=>+c.dataset.g===target); c.classList.add('picked','reveal');
      L.classList.remove('drawing'); L.classList.add('st-'+k); showRes(idx); drawBusy=false;
    }, end+260);
  }});

/* ---------- 배경음악 (BGM) ----------

const BGM_DEF={tension:{src:'audio/bgm-tension.mp3',vol:.13},next:{src:'audio/bgm-next.mp3',vol:.12},work:{src:'audio/bgm-work.mp3',vol:.1},intro:{src:'audio/bgm-intro.mp3',vol:.14},home:{src:'audio/bgm-home.mp3',vol:.15},street:{src:'audio/bgm-street.mp3',vol:.15},library:{src:'audio/bgm-library.mp3',vol:.12},final:{src:'audio/bgm-final.mp3',vol:.13}};
class Ramp{constructor(v){this.v=v;this.t=v;this.r=1}to(t,sec){this.t=t;this.r=Math.abs(t-this.v)/Math.max(sec,.01)}step(dt){if(this.v<this.t)this.v=Math.min(this.t,this.v+this.r*dt);else if(this.v>this.t)this.v=Math.max(this.t,this.v-this.r*dt)}}

  v.addEventListener('play',()=>{stopSfx();videoHold=true;clearTimeout(vidTimer);vid.to(0,.7);w.classList.add('playing');pp.textContent='❚❚'});
  v.addEventListener('pause',()=>{w.classList.remove('playing');pp.textContent='▶'});
  v.addEventListener('ended',()=>{ clearTimeout(vidTimer); vidTimer=setTimeout(()=>{ if(!videoPlaying()) releaseVideoHold(); },500);w.classList.remove('playing');pp.textContent='↺';pb.querySelector('span').textContent='↺';pb.querySelector('em').textContent='다시 보려면 클릭하세요'});
  v.addEventListener('timeupdate',()=>{fill.style.width=(v.currentTime/(v.duration||1)*100)+'%';tm.textContent=fmt(v.currentTime)+' / '+fmt(v.duration)});
  v.addEventListener('loadedmetadata',()=>{tm.textContent='0:00 / '+fmt(v.duration)});
  tr.addEventListener('click',e=>{e.stopPropagation();const r=tr.getBoundingClientRect();v.currentTime=((e.clientX-r.left)/r.width)*(v.duration||0)});
  v.addEventListener('playing',()=>{pb.querySelector('span').textContent='▶';pb.querySelector('em').textContent='클릭하면 광고 영상이 재생됩니다'});
}
document.querySelectorAll('.vwrap').forEach(wireVideo);

/* ---------- 라이트박스 (모둠 미션 보드) ---------- */
const lb=document.getElementById('lightbox'), lbIn=document.getElementById('lbIn');
function openLB(i){
  const c=CARDS[i];
  lbIn.innerHTML=c.video?video(c.video,c.img,'vLB'):`<img src="${c.img}" alt="">`;
  const w=lbIn.querySelector('.vwrap'); if(w)wireVideo(w);
  lb.classList.add('open'); sfx('pop');
}
function closeLB(){ if(!lb.classList.contains('open'))return; const v=lbIn.querySelector('video'); if(v)v.pause(); releaseVideoHold(); lb.classList.remove('open'); lbIn.innerHTML=''; }
document.getElementById('lbClose').addEventListener('click',closeLB);
lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});
document.querySelectorAll('[data-card]').forEach(el=>{
  el.addEventListener('click',()=>openLB(+el.dataset.card));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openLB(+el.dataset.card)}});
});

/* ---------- 메뉴 이동 ---------- */
const menuPanel=document.getElementById('menuPanel'), menuBtn=document.getElementById('menuBtn');
const SECTIONS=['p1cover','p1goal','p1div','p2div','p2demo','title','s1card','s2card','s3card','final','lotto','present','nextclass'];
function sectionOf(i){ const si=STEPS[i].si; let best=null;
  SECTIONS.forEach(id=>{const j=SCENES.findIndex(x=>x.id===id); if(j>=0&&j<=si) best=id;}); return best; }
function toggleMenu(open){ const o=open??!menuPanel.classList.contains('open'); menuPanel.classList.toggle('open',o); menuBtn.setAttribute('aria-expanded',o);
  if(o){ const sec=sectionOf(cur); menuPanel.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('cur',b.dataset.jump===sec&&!(sec==='final'&&STEPS[cur].k<8&&b.dataset.k))); } }
function jumpTo(id,k=0){
  const idx=STEPS.findIndex(st=>SCENES[st.si].id===id&&st.k===k); if(idx<0) return;
  if(!audioOn){audioOn=true;Object.values(BGM).forEach(t=>t.a.load());}
  toggleMenu(false); pauseAll(); closeLB(); sfx('click');
  go(idx);
}
menuBtn.addEventListener('click',e=>{e.stopPropagation();if(!audioOn){audioOn=true;Object.values(BGM).forEach(t=>t.a.load());}sfx('click');toggleMenu();menuBtn.blur();});
document.getElementById('endHome').addEventListener('click',e=>{e.stopPropagation();jumpTo('p1cover');});
document.getElementById('homeBtn').addEventListener('click',e=>{e.stopPropagation();jumpTo('p1cover');e.currentTarget.blur();});
menuPanel.addEventListener('click',e=>{const b=e.target.closest('[data-jump]'); if(!b)return; e.stopPropagation(); jumpTo(b.dataset.jump,+(b.dataset.k||0));});
document.addEventListener('click',e=>{ if(menuPanel.classList.contains('open')&&!e.target.closest('#menuPanel')&&!e.target.closest('#menuBtn')) toggleMenu(false); });

/* ---------- 15분 활동 타이머 ---------- */
const TOTAL=15*60*1000; let tLeft=TOTAL, tEnd=0, tRun=false, tIv=null, tFlags={};
const tBox=document.getElementById('timerBox'), tDig=document.getElementById('tDigits'), tS=document.getElementById('tStart'), tP=document.getElementById('tPause'), tR=document.getElementById('tReset');
function tPaint(){ const sec=Math.max(0,Math.ceil(tLeft/1000)); tDig.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); tBox.classList.toggle('last',sec<=60&&sec>0); }
function tTick(){ tLeft=tEnd-Date.now(); const sec=Math.ceil(tLeft/1000);
  if(sec<=300&&!tFlags.f5){tFlags.f5=1;playNow('alert5');}
  if(sec<=60&&!tFlags.f1){tFlags.f1=1;playNow('alert1');}
  if(tLeft<=0){ tLeft=0; tStop(); tFlags.done=1; tBox.classList.add('done'); clearTimeout(duckTimer); duck.to(.35,2.5); playNow('complete'); setTimeout(()=>playNow('success'),900); tS.disabled=true; }
  tPaint(); }
function tStop(){ tRun=false; clearInterval(tIv); tP.disabled=true; tS.disabled=false; tS.textContent='▶ 계속하기'; }
tS.addEventListener('click',e=>{ e.stopPropagation(); if(tRun||tLeft<=0) return; if(!audioOn){audioOn=true;} tRun=true; tEnd=Date.now()+tLeft; clearInterval(tIv); tIv=setInterval(tTick,200); tP.disabled=false; tS.disabled=true; playNow('start'); tS.blur(); });
tP.addEventListener('click',e=>{ e.stopPropagation(); if(!tRun) return; tLeft=tEnd-Date.now(); tStop(); sfx('click'); tPaint(); tP.blur(); });
tR.addEventListener('click',e=>{ e.stopPropagation(); clearInterval(tIv); tRun=false; tLeft=TOTAL; tFlags={}; tBox.classList.remove('done','last'); tS.disabled=false; tP.disabled=true; tS.textContent='▶ 활동 시작'; sfx('click'); tPaint(); tR.blur(); });

document.querySelectorAll('.pr-img').forEach(im=>im.addEventListener('click',e=>{e.stopPropagation();openLB(+im.dataset.lb);}));

/* ---------- 입력 ---------- */
document.getElementById('nextBtn').addEventListener('click',nextStep);
document.getElementById('backBtn').addEventListener('click',prevStep);
document.getElementById('startBtn').addEventListener('click',nextStep);
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-zclose]'), o=e.target.closest('[data-zok]');
  if(!c&&!o) return;
  const sc=SCENES[STEPS[cur].si]; if(!sc.gate) return;
  e.stopPropagation(); pauseAll();
  if(o){ nextStep(); return; }
  const gi=STEPS.findIndex(st=>st.si===STEPS[cur].si&&st.k===sc.gate.at); if(gi>=0) go(gi);
});
document.querySelectorAll('[data-next]').forEach(el=>el.addEventListener('click',e=>{
  // 해당 요소가 현재 보이는 단계에서만 작동
  const sc=el.closest('.scene'); if(!sc.classList.contains('active'))return;
  const hidden=el.closest('[data-on]:not(.vis)'); if(hidden)return;
  if(el.closest('.focus.vis')||el.closest('.mission.vis'))return;
  if(el.dataset.nextAt!==undefined && STEPS[cur].k!==+el.dataset.nextAt)return;
  e.stopPropagation(); nextStep();
}));
document.addEventListener('keydown',e=>{
  if(lb.classList.contains('open')){ if(e.key==='Escape')closeLB(); return; }
  if(e.key==='Escape'&&menuPanel.classList.contains('open')){ toggleMenu(false); return; }
  if(e.target&&e.target.closest&&e.target.closest('.t-btns'))return;
  const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){ if(document.activeElement&&document.activeElement.tagName==='VIDEO')return; if(k==='Enter'&&document.activeElement&&document.activeElement.dataset.card!==undefined)return; e.preventDefault(); nextStep(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){ e.preventDefault(); prevStep(); }
  else if(k==='f'||k==='F'){ toggleFS(); }
  else if(k==='m'||k==='M'){ setMute(!muted); }
  else if(k==='b'||k==='B'){ setBgmOn(!bgmOn); }
});
function toggleFS(){ if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
document.getElementById('fsBtn').addEventListener('click',toggleFS);

/* ---------- 화면 고정: 무대 내부가 스크롤되지 않게 ---------- */
['stage','scenes'].forEach(id=>{const el=document.getElementById(id); el.addEventListener('scroll',()=>{ if(el.scrollTop||el.scrollLeft){el.scrollTop=0;el.scrollLeft=0;} });});
document.querySelectorAll('.scene,.scene>.full').forEach(el=>el.addEventListener('scroll',()=>{ if(el.scrollTop||el.scrollLeft){el.scrollTop=0;el.scrollLeft=0;} }));
addEventListener('scroll',()=>{ if(scrollX||scrollY) scrollTo(0,0); });
/* ---------- 16:9 맞춤 ---------- */
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit); fit();

go(0);
</script>
